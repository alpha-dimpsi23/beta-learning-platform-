<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beta — Making Learning Easier</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        background: #000;
        color: #fff;
        font-family: "Segoe UI", Arial, sans-serif;
        overflow: hidden;
    }

    .splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 12vh 20px 7vh;
        text-align: center;
        animation: fadeOut 0.7s ease 3.2s forwards;
    }

    .center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .beta-mark {
        width: 145px;
        height: 145px;
        border: 10px solid #010f17;
        border-radius: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 110px;
        font-family: Georgia, serif;
        font-weight: 300;
        line-height: 1;
        box-shadow: 0 0 35px rgba(0,122,255,.22);
        animation: logoIn 1s ease-out forwards, pulse 2s ease-in-out 1.1s infinite;
    }

    .brand {
        margin-top: 28px;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 1px;
        opacity: 0;
        animation: rise 0.7s ease 0.45s forwards;
    }

    .slogan {
        margin-top: 9px;
        color: #8d8d93;
        font-size: 16px;
        opacity: 0;
        animation: rise 0.7s ease 0.7s forwards;
    }

    .loader {
        width: 105px;
        height: 4px;
        background: #1f1f1f;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 32px;
    }

    .loader span {
        display: block;
        height: 100%;
        width: 0;
        background: #007aff;
        border-radius: inherit;
        animation: load 2.7s ease forwards;
    }

    .footer {
        color: #777;
        font-size: 14px;
        opacity: 0;
        animation: rise 0.7s ease 0.9s forwards;
    }

    .footer strong {
        color: #007aff;
        font-size: 18px;
    }

    @keyframes logoIn {
        from { opacity: 0; transform: scale(.65) rotate(-8deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes load {
        from { width: 0; }
        to { width: 100%; }
    }

    @keyframes pulse {
        0%,100% { box-shadow: 0 0 28px rgba(0,122,255,.18); }
        50% { box-shadow: 0 0 50px rgba(0,122,255,.42); }
    }

    @keyframes fadeOut {
        to { opacity: 0; visibility: hidden; }
    }

    @media (max-width: 480px) {
        .beta-mark { width: 120px; height: 120px; font-size: 90px; border-width: 8px; }
        .brand { font-size: 32px; }
    }
</style>
</head>
<body>
    <main class="splash">
        <div class="center">
            <div class="beta-mark">&beta;</div>
            <div class="brand">beta</div>
            <div class="slogan">Making Learning Easier</div>
            <div class="loader"><span></span></div>
        </div>

        <div class="footer">by <strong>Beta Learning</strong></div>
    </main>

    <script>
        // Change betta4.html to the filename of your main website if needed.
        setTimeout(() => {
            window.location.replace("auth.html");
        }, 3500);
    </script>
</body>
</html>
